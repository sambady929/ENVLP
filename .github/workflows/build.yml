name: build

# The repository carries the source needed to build ENVLP plus a portable
# Windows release. Pushing a v* tag produces ENVLP-win64.zip and attaches it
# to the matching GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-gmp
            mingw-w64-ucrt-x86_64-wxwidgets3.3-common
            mingw-w64-ucrt-x86_64-wxwidgets3.3-common-libs
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw-libs

      # GiNaC and CLN are not packaged by MSYS2; build them once.
      - name: Build GiNaC + CLN
        run: |
          set -e
          mkdir -p /tmp/deps && cd /tmp/deps
          curl -L -o cln.tar.bz2 https://www.ginac.de/CLN/cln-1.3.7.tar.bz2
          curl -L -o ginac.tar.bz2 https://www.ginac.de/ginac-1.8.10.tar.bz2
          tar xf cln.tar.bz2 && cd cln-1.3.7
          ./configure --prefix=/ucrt64 && make -j$(nproc) && make install
          cd .. && tar xf ginac.tar.bz2 && cd ginac-1.8.10
          ./configure --prefix=/ucrt64 && make -j$(nproc) && make install

      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # Only a tagged build produces/attaches the portable release.
      - name: Package portable build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/make_portable.ps1
          $dir = (Get-ChildItem dist -Directory | Select-Object -First 1).FullName
          Compress-Archive -Path "$dir\*" -DestinationPath "ENVLP-win64.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ENVLP-win64.zip
          generate_release_notes: true
